name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static frontend only
        run: |
          mkdir _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='.github' --exclude='supabase' --exclude='scripts' --exclude='deploy.ps1' --exclude='serve.ps1' --exclude='README.md' ./ _site/
          touch _site/.nojekyll
      - name: Safety check (no secrets, no old project references)
        run: |
          if grep -rIlE "uvwarprsghwvrfmdaaqv|sb_secret_|eyJ[A-Za-z0-9_-]{30,}\." _site; then echo "Sensitive reference found"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4